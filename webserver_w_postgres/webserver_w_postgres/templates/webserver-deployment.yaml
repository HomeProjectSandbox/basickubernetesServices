apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-webserver
  labels:
    app: {{ .Release.Name }}-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-webserver
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-webserver
    spec:
      containers:
        - name: {{ .Values.webserver.containerName }}
          image: {{ .Values.webserver.image }}
          ports:
            - containerPort: {{ .Values.webserver.ports[0].containerPort }}